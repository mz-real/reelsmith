[project]
name = "reelsmith"
version = "0.1.0"
description = "A local first CLI that turns an app into a narrated demo video."
license = "MIT"
requires-python = ">=3.11,<3.14"
authors = [{ name = "reelsmith contributors" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "platformdirs>=4.2",
    "numpy>=1.26",
    "soundfile>=0.12",
    "playwright>=1.43",
    "kokoro-onnx>=0.6,<0.7",
    "faster-whisper>=1.2,<1.3",
]

[project.optional-dependencies]
clone = [
    "chatterbox-tts; python_version < '3.13'",
    "setuptools<81",
]

[project.scripts]
reelsmith = "reelsmith.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reelsmith"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["kokoro_onnx.*", "faster_whisper.*", "soundfile.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: real Kokoro and Whisper model test, needs REELSMITH_TEST_MODELS=1 and downloads models",
]
