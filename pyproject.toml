[project]
name = "reelsmith"
version = "0.1.0"
description = "A local first CLI that turns an app into a narrated demo video."
license = "MIT"
requires-python = ">=3.11,<3.14"
authors = [{ name = "reelsmith contributors" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "platformdirs>=4.2",
    "numpy>=1.26",
    "soundfile>=0.12",
    "playwright>=1.43",
    "kokoro-onnx>=0.6,<0.7",
    "faster-whisper>=1.2,<1.3",
    "pillow>=10.1",
]

[project.optional-dependencies]
clone = [
    # 0.1.3 and later need pkuseg, whose setup.py imports numpy without
    # declaring it, so every isolated install fails to build it. 0.1.2 is the
    # last release without it and has everything reelsmith uses (English).
    "chatterbox-tts==0.1.2; python_version < '3.13'",
    "setuptools<81",
]

[project.scripts]
reelsmith = "reelsmith.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reelsmith"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["kokoro_onnx.*", "faster_whisper.*", "onnxruntime.*", "soundfile.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/qa"]
addopts = ["-m", "not integration and not models", "--import-mode=importlib"]
markers = [
    "integration: full pipeline test with ffmpeg and optional Playwright",
    "models: real Kokoro and Whisper model test, needs REELSMITH_TEST_MODELS=1 and downloads models",
]

[tool.reelsmith]
# Flip to true in the release PR, when the version is on PyPI. The generated
# instructions then show "uv tool install reelsmith" instead of the Git URL.
published = true
