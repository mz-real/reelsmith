<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>{{ styles }}</style>
</head>
<body class="{{ body_class }}">
<div class="bg"><div class="glow g1"></div><div class="glow g2"></div><div class="vignette"></div><div class="grain"></div></div>
{{ chapter }}
<main class="stage">
<header class="head">{{ head }}</header>
<section class="body">{{ body }}</section>
</main>
{{ footer }}
<script>
(function () {
  if (document.querySelector('.arch')) return;
  if (window.__reelsmithReady !== undefined) return;
  window.__reelsmithReady = false;
  document.fonts.ready.then(function () { window.__reelsmithReady = true; });
})();
</script>
</body>
</html>
