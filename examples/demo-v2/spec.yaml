version: 1
mode: produce
goal: Narrated demo videos, made on your machine
audience: developers who use an AI coding tool
target_seconds: 390
formats:
- '16:9'
quality: 1080p
theme: studio
footage: web
voice:
  engine: kokoro
  kokoro_voice: af_heart
  speed: 1.0
  vocabulary:
  - reelsmith
  - Kokoro
  - Chatterbox
  - Maestro
  - Playwright
  - Whisper
  - Codex
  - Cursor
  - Gemini
  - Copilot
  - YAML
  - narrate
  - pace
  - one
  pronounce:
    reelsmith: ɹˈiːl smɪθ
options:
  allow_holds: true
  speed_up_waits: true
  captions: srt
  highlight_clicks: true
  transition: fade
scenes:
- id: open
  layout: phone
  clip: open-phone
  eyebrow: A finished demo
  title: Made with *reelsmith*
  points:
  - text: Narrated, with *captions*
    line: open-1
  - text: Clicks that line up with the voice
    line: open-1
  - text: Made from *one request*
    line: open-2
- id: overview
  layout: slide
  slide: overview
