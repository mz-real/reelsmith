<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terminal replay</title>
    <style>
      :root {
        --page: #1b1d23;
        --window: #0f1115;
        --bar: #262931;
        --text: #e6e6e6;
        --dim: #8a8f98;
        --prompt: #7fd18b;
        --you: #6cc4f0;
        --assistant: #c9a3f5;
        --ok: #7fd18b;
        --warn: #f0c36c;
        --error: #f07c7c;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--page);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
      }
      .window {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--window);
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
      .bar {
        flex: none;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bar);
        color: var(--dim);
        font: 14px ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace;
      }
      .screen {
        flex: 1;
        overflow: hidden;
        padding: 18px 24px;
        color: var(--text);
        font: 19px/1.45 ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .note {
        color: var(--dim);
      }
      .cmd {
        margin-top: 10px;
      }
      .cmd:first-child,
      .note + .cmd {
        margin-top: 0;
      }
      .note {
        margin-top: 10px;
      }
      .note:first-child {
        margin-top: 0;
      }
      .prompt {
        color: var(--prompt);
        margin-right: 0.6em;
      }
      .prompt.you {
        color: var(--you);
      }
      .caret {
        display: inline-block;
        width: 0.6em;
        height: 1.1em;
        vertical-align: text-bottom;
        background: var(--text);
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .out {
        color: #c8ccd2;
      }
      .ok {
        color: var(--ok);
      }
      .warn {
        color: var(--warn);
      }
      .error {
        color: var(--error);
      }
      .assistant {
        color: var(--assistant);
      }
    </style>
  </head>
  <body>
    <div class="window">
      <div class="bar" data-testid="title">terminal</div>
      <div class="screen" data-testid="screen" id="screen"></div>
    </div>
    <script src="sessions.js"></script>
    <script src="replay.js"></script>
  </body>
</html>
